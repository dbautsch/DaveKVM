 if(!['h264','h264_qsv','hevc_qsv','raw'].includes(formatInput.value)||!['ultrafast','superfast','veryfast'].includes(presetInput.value)||!Number.isInteger(crf)||crf<1||crf>30||!Number.isInteger(bitrate)||bitrate<1000||bitrate>30000||!['veryfast','faster','fast','medium','slow','slower','veryslow'].includes(qsvPreset)||!['baseline','main','high'].includes(qsvProfile)||!['cbr','vbr','cqp','icq'].includes(qsvMode)||!Number.isInteger(qsvQuality)||qsvQuality<1||qsvQuality>51||!Number.isInteger(qsvGop)||qsvGop<15||qsvGop>300||(formatInput.value.endsWith('_qsv')&&qsvMode==='vbr'&&bitrate===30000)){status.textContent='Nieprawidłowe ustawienia obrazu.';return}
 if(controlToken)stop('Sterowanie wyłączone podczas zmiany obrazu.');
 applied={format:formatInput.value,preset:presetInput.value,crf,bitrate,qsvPreset,qsvProfile,qsvMode,qsvQuality,qsvGop};
 saveSettings();
 if(current){status.textContent='Łączenie obrazu...';startPreview(current)}
});
function choose(d){if(controlToken)stop('Sterowanie wyłączone.');current=d.id;empty.hidden=true;status.textContent=d.name+' · '+d.id;startPreview(d.id);renderControl();refresh()}
async function refresh(){try{const res=await fetch('/grabber/api/devices',{cache:'no-store'});if(!res.ok)throw Error();const devices=await res.json();controllableDevices=new Set(devices.filter(d=>d.control).map(d=>d.id));list.replaceChildren();if(!devices.length)list.textContent='Nie wykryto urządzeń.';for(const d of devices){const b=document.createElement('button');b.className='device'+(current===d.id?' active':'');b.type='button';b.textContent=d.name;const small=document.createElement('small');small.textContent=(d.id.startsWith('remote-')?'remote · /dev/'+d.id.slice(7):'local · /dev/'+d.id);b.append(small);b.onclick=()=>choose(d);list.append(b)}if(current&&!devices.some(d=>d.id===current)){if(controlToken)stop('Urządzenie zostało odłączone.');current=null;stopPreview();video.hidden=true;rawImage.hidden=true;empty.hidden=false;empty.textContent='Urządzenie zostało odłączone.';status.textContent='Wybierz grabber z listy';renderControl()}}catch(e){list.textContent='Nie udało się pobrać listy urządzeń.'}}
document.querySelector('#full').onclick=()=>document.querySelector('#screen').requestFullscreen?.();document.querySelector('#exit-full').onclick=()=>document.exitFullscreen?.();
async function refreshEncoders(){
 try{const response=await fetch('/grabber/api/encoders',{cache:'no-store'});if(!response.ok)return;const data=await response.json();
  for(const value of ['h264_qsv','hevc_qsv'])document.querySelector('#format option[value="'+value+'"]').disabled=!data.qsv;
 }catch(e){}
}
renderControl();refresh();refreshEncoders();setInterval(refresh,5000);
</script></body></html>
